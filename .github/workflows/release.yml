name: Immutable Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, SBOM & Immutable Release
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build plugin bundle
        run: make dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json

      - name: Compute Cryptographic Checksums (SHA-256)
        run: |
          cd dist
          sha256sum *.tar.gz sbom.spdx.json sbom.cyclonedx.json > checksums.txt
          cat checksums.txt

      - name: Attest Build Provenance (SLSA / Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/sbom.spdx.json
            dist/sbom.cyclonedx.json
            dist/checksums.txt

      - name: Publish Immutable GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/sbom.spdx.json
            dist/sbom.cyclonedx.json
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
