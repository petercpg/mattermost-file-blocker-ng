name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check style, manifest & lint
        run: make check-style

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go Unit Tests
        run: |
          go test -race -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload Coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.txt
          retention-days: 7

  build-check:
    name: Build & Package Bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build plugin bundle
        run: make dist

      - name: Upload Plugin Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-bundle
          path: dist/*.tar.gz
          retention-days: 14
