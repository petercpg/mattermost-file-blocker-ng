<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>
  </defs>

  <!-- Shield Base -->
  <path d="M50 8 L85 22 V50 C85 72 50 92 50 92 C50 92 15 72 15 50 V22 Z" fill="url(#shieldGrad)" />
  
  <!-- File Shape -->
  <path d="M35 30 H55 L65 40 V70 H35 Z" fill="#FFFFFF" opacity="0.9" />
  <path d="M55 30 V40 H65" fill="#E0E0E0" />
  
  <!-- File lines -->
  <line x1="42" y1="48" x2="58" y2="48" stroke="#757575" stroke-width="2.5" stroke-linecap="round" />
  <line x1="42" y1="55" x2="58" y2="55" stroke="#757575" stroke-width="2.5" stroke-linecap="round" />
  <line x1="42" y1="62" x2="52" y2="62" stroke="#757575" stroke-width="2.5" stroke-linecap="round" />

  <!-- Blocking Prohibitive Circle & Slash -->
  <circle cx="62" cy="62" r="16" fill="none" stroke="url(#slashGrad)" stroke-width="4.5" />
  <line x1="51" y1="51" x2="73" y2="73" stroke="url(#slashGrad)" stroke-width="4.5" stroke-linecap="round" />
</svg>
